spring:
  application:
    name: lucascaffe

  datasource:
    url: jdbc:postgresql://localhost:5432/lucascaffe
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
